<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss English</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8ef; color: #2b2140;
    font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, -apple-system, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: clamp(36px, 7vw, 64px); margin: 0 0 8px; }
  h1 span { color: #ff5d73; }
  p { color: #7a6f8c; margin: 0 0 28px; }
  a { display: inline-flex; align-items: center; gap: 10px; padding: 16px 22px; border-radius: 16px; background: #fff;
    color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; box-shadow: 0 6px 24px rgba(43,33,64,.1); transition: transform .1s; }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<main>
  <h1>Miss <span>English</span></h1>
  <p>Werkzeuge für den Unterricht</p>
  <a href="/zufallsgenerator/">🎡 Zufallsgenerator</a>
</main>
</body>
</html>
